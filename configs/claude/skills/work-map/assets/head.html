<!doctype html>
<html lang="ja">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>

<style>
*,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  * {
    margin: 0;
    padding: 0;
  }

  :root {
    --paper: #f3f5f3;
    --surface: #fafbfa;
    --sunken: #e9edeb;
    --ink: #141a1c;
    --ink-2: #33403f;
    --ink-3: #667073;
    --rule: #d3dad8;
    --rule-strong: #b6c0bd;
    --accent: #186a83;
    --accent-weak: #d9e8ed;
    --good: #3e7a50;
    --warn: #8a6714;
    --serious: #a2552a;

    --font-display: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Songti SC", serif;
    --font-body: "Hiragino Sans", "Yu Gothic", "YuGothic", system-ui, -apple-system, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --step-0: 0.95rem;
    --step-1: 1.1rem;
    --step-2: 1.35rem;
    --step-3: 1.9rem;
    --label: 0.7rem;
    --small: 0.82rem;

    /* 読み物としての行長。図と表はこの制限を受けない */
    --measure: 40rem;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--step-0);
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- 骨格: 固定レール + 伸びる本体 ---- */

  .shell {
    display: grid;
    grid-template-columns: 14rem minmax(0, 1fr);
    gap: 0 4rem;
    max-width: 108rem;
    margin: 0 auto;
    padding: 3rem 3rem 6rem;
  }

  .rail {
    position: sticky;
    top: 3rem;
    align-self: start;
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
    border-right: 1px solid var(--rule);
    padding-right: 1.5rem;
    min-height: 0;
  }

  .main {
    display: flex;
    flex-direction: column;
    gap: 3.5rem;
    min-width: 0;
  }

  .prose {
    max-width: var(--measure);
  }

  /* ---- レール ---- */

  .rail-title {
    font-family: var(--font-display);
    font-size: var(--step-1);
    font-weight: 600;
    line-height: 1.5;
  }

  .rail-meta {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    font-family: var(--font-mono);
    font-size: var(--label);
    letter-spacing: 0.06em;
    color: var(--ink-3);
  }

  .rail nav {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  .rail nav a {
    color: var(--ink-2);
    text-decoration: none;
    font-size: var(--small);
    padding: 0.2rem 0;
    border-left: 2px solid transparent;
    padding-left: 0.7rem;
    margin-left: -0.7rem;
  }

  .rail nav a:hover {
    color: var(--ink);
    border-left-color: var(--accent);
  }

  .rail-count {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .count-row {
    display: grid;
    grid-template-columns: 2.5rem 1fr;
    align-items: baseline;
    gap: 0.6rem;
  }

  .count-row b {
    font-family: var(--font-mono);
    font-size: var(--step-1);
    font-variant-numeric: tabular-nums;
    font-weight: 400;
    text-align: right;
  }

  .count-row span {
    font-family: var(--font-mono);
    font-size: var(--label);
    letter-spacing: 0.08em;
    color: var(--ink-3);
  }

  .count-row.open b {
    color: var(--serious);
  }

  .count-row.warn b {
    color: var(--warn);
  }

  /* ---- 見出し ---- */

  .eyebrow {
    font-family: var(--font-mono);
    font-size: var(--label);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  h1 {
    font-family: var(--font-display);
    font-size: var(--step-3);
    font-weight: 600;
    line-height: 1.35;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }

  h2 {
    font-family: var(--font-display);
    font-size: var(--step-2);
    font-weight: 600;
    line-height: 1.45;
    text-wrap: balance;
  }

  .masthead {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .masthead p {
    color: var(--ink-2);
  }

  section {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    scroll-margin-top: 2rem;
  }

  .section-head {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.6rem;
  }

  /* ---- 次の一手 ---- */

  .next {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    border-top: 1px solid var(--rule-strong);
    border-bottom: 1px solid var(--rule-strong);
    padding: 1.1rem 0;
  }

  .next-what {
    font-family: var(--font-display);
    font-size: var(--step-2);
    font-weight: 600;
    line-height: 1.5;
    text-wrap: balance;
    max-width: var(--measure);
  }

  /* ---- 依存グラフ ---- */

  .figure {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .scroller {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--rule);
    max-width: 72rem;
  }

  .scroller svg {
    display: block;
    min-width: 46rem;
    width: 100%;
    height: auto;
  }

  .node-box {
    fill: var(--sunken);
    stroke: var(--rule-strong);
    stroke-width: 1;
  }

  .node-box.settled {
    fill: var(--accent-weak);
    stroke: var(--accent);
  }

  .node-box.open {
    fill: none;
    stroke: var(--serious);
    stroke-dasharray: 5 3;
  }

  .node-label {
    font-family: var(--font-body);
    font-size: 12.5px;
    fill: var(--ink);
  }

  .col-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    fill: var(--ink-3);
  }

  .edge {
    fill: none;
    stroke: var(--rule-strong);
    stroke-width: 1.5;
  }

  .arrow-head {
    fill: var(--rule-strong);
  }

  .caption {
    font-size: var(--small);
    color: var(--ink-2);
    max-width: var(--measure);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.4rem;
    font-family: var(--font-mono);
    font-size: var(--label);
    letter-spacing: 0.06em;
    color: var(--ink-2);
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
  }

  .swatch {
    width: 1.1rem;
    height: 0.7rem;
    border: 1px solid var(--rule-strong);
    background: var(--sunken);
  }

  .swatch.settled {
    background: var(--accent-weak);
    border-color: var(--accent);
  }

  .swatch.open {
    background: none;
    border: 1px dashed var(--serious);
  }

  /* ---- 経緯 ---- */

  .track {
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--rule-strong);
    margin-left: 0.4rem;
  }

  .beat {
    display: grid;
    grid-template-columns: 7rem minmax(0, var(--measure));
    gap: 0 1.5rem;
    padding: 0 0 1.5rem 1.5rem;
    position: relative;
  }

  .beat::before {
    content: "";
    position: absolute;
    left: -4.5px;
    top: 0.62rem;
    width: 8px;
    height: 8px;
    background: var(--paper);
    border: 1.5px solid var(--rule-strong);
    border-radius: 50%;
  }

  .beat.now::before {
    background: var(--accent);
    border-color: var(--accent);
  }

  .beat .when {
    font-family: var(--font-mono);
    font-size: var(--label);
    letter-spacing: 0.06em;
    color: var(--ink-3);
    padding-top: 0.35rem;
  }

  .beat .what {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }

  .beat .what b {
    font-weight: 600;
  }

  .beat .what span {
    color: var(--ink-2);
    font-size: var(--small);
  }

  /* ---- 論点 ---- */

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: var(--small);
  }

  caption {
    text-align: left;
    font-family: var(--font-mono);
    font-size: var(--label);
    letter-spacing: 0.1em;
    color: var(--ink-3);
    padding-bottom: 0.6rem;
  }

  th,
  td {
    text-align: left;
    vertical-align: top;
    padding: 0.7rem 0.9rem;
    border-bottom: 1px solid var(--rule);
  }

  thead th {
    font-family: var(--font-mono);
    font-size: var(--label);
    letter-spacing: 0.1em;
    color: var(--ink-3);
    font-weight: 400;
    border-bottom: 1px solid var(--rule-strong);
    white-space: nowrap;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  td.subject {
    font-weight: 600;
    width: 16rem;
  }

  td.state {
    width: 7rem;
  }

  tbody td:nth-child(3) {
    max-width: 40rem;
  }

  /* 出所 — リンクが付いていれば一次情報がある。無いものは何に基づくかを語で示す */
  td.source {
    width: 11rem;
    font-family: var(--font-mono);
    font-size: var(--label);
    letter-spacing: 0.03em;
    line-height: 1.6;
  }

  td.source a {
    text-decoration-thickness: 1px;
  }

  .src-none {
    color: var(--ink-3);
  }

  td .why {
    display: block;
    color: var(--ink-2);
    font-weight: 400;
    padding-top: 0.15rem;
  }

  .chip {
    display: inline-flex;
    align-items: baseline;
    gap: 0.35rem;
    font-family: var(--font-mono);
    font-size: var(--label);
    letter-spacing: 0.08em;
    white-space: nowrap;
    padding: 0.15rem 0.5rem;
    border: 1px solid currentColor;
    color: var(--ink-2);
  }

  .chip::before {
    font-size: 0.85em;
  }

  .chip.settled {
    color: var(--good);
  }

  .chip.settled::before {
    content: "\2713";
  }

  .chip.open {
    color: var(--serious);
  }

  .chip.open::before {
    content: "\003F";
  }

  .chip.warn {
    color: var(--warn);
  }

  .chip.warn::before {
    content: "\26A0";
  }


  /* ---- 一般 ---- */

  a {
    color: var(--accent);
    text-underline-offset: 0.2em;
  }

  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  code {
    font-family: var(--font-mono);
    font-size: 0.88em;
    background: var(--sunken);
    padding: 0.1em 0.35em;
  }

  .footnote {
    font-size: var(--small);
    color: var(--ink-3);
    border-top: 1px solid var(--rule);
    padding-top: 1rem;
    max-width: var(--measure);
  }

  /* ---- 画面が狭いとき: レールを畳んで上へ ---- */

  @media (max-width: 64rem) {
    .shell {
      grid-template-columns: minmax(0, 1fr);
      gap: 2.5rem;
      padding: 2rem 1.25rem 4rem;
    }

    .rail {
      position: static;
      border-right: none;
      border-bottom: 1px solid var(--rule);
      padding-right: 0;
      padding-bottom: 1.5rem;
    }

    .rail nav {
      flex-direction: row;
      flex-wrap: wrap;
      gap: 0 1.25rem;
    }

    .rail nav a {
      border-left: none;
      padding-left: 0;
      margin-left: 0;
    }

    .rail-count {
      flex-direction: row;
      gap: 1.5rem;
    }

    .count-row {
      grid-template-columns: auto auto;
      gap: 0.4rem;
    }
  }

  @media (max-width: 40rem) {
    .beat {
      grid-template-columns: 1fr;
      gap: 0.2rem;
    }

    .beat .when {
      padding-top: 0;
    }

    td.subject,
    td.state {
      width: auto;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
  /* ---- チャート ---- */

  .chart {
    background: var(--surface);
    border: 1px solid var(--rule);
    max-width: 72rem;
  }

  .chart svg {
    display: block;
    width: 100%;
    height: auto;
    min-width: 40rem;
  }

  .grid {
    stroke: var(--rule);
    stroke-width: 1;
  }

  .tick {
    font-family: var(--font-mono);
    font-size: 10px;
    fill: var(--ink-3);
  }

  .area {
    fill: var(--accent-weak);
  }

  .line {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-linejoin: round;
  }

  .peak {
    fill: var(--accent);
  }

  .peak-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    fill: var(--ink);
  }

  /* ---- ベン図（表で分かりにくいと言われたときだけ） ---- */

  .set {
    fill: var(--accent);
    fill-opacity: 0.1;
    stroke: var(--accent);
    stroke-width: 1.2;
  }

  .set-name {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    fill: var(--accent);
    font-weight: 600;
  }

  .region {
    font-family: var(--font-body);
    font-size: 12.5px;
    fill: var(--ink);
  }

  .region-empty {
    font-family: var(--font-body);
    font-size: 11.5px;
    fill: var(--ink-3);
    font-style: italic;
  }
</style>
</head>

<body>
